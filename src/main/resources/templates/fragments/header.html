<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="header">
    <nav class="navbar navbar-expand-md navbar-light bg-light shadow-sm border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand text-uppercase fw-bold" href="/">
                <i class="bi bi-shop me-2"></i> Shop
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent" aria-controls="navbarContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                        <a class="nav-link" href="/admin/item/new">상품 등록</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                        <a class="nav-link" href="/admin/items">상품 관리</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/cart">장바구니</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/orders">구매이력</a>
                    </li>
                </ul>

                <ul class="navbar-nav d-flex align-items-center">
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link btn btn-outline-dark me-2" href="/members/login">로그인</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link btn btn-outline-dark me-2" href="/members/logout">로그아웃</a>
                    </li>

                    <li class="nav-item">
                        <form class="d-flex" th:action="@{/}" method="get">
                            <input name="searchQuery" class="form-control me-2" type="search" placeholder="상품 검색" aria-label="Search">
                            <button class="btn btn-secondary" type="submit">검색</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

</html>
