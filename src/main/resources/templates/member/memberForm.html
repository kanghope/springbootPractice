<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">

<th:block layout:fragment="css">
    <style>
        /* 필드 오류 메시지 색상 */
        .fieldError {
            color: #bd2130; /* 붉은색 유지 */
        }

        /* 폼 컨테이너를 밝게 조정하는 스타일 추가 */
        .member-form-container {
            /* 배경을 밝게 (흰색) */
            background-color: #ffffff;
            /* 내부 여백 추가 */
            padding: 30px;
            /* 가벼운 그림자 추가하여 영역 강조 */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            /* 모서리를 약간 둥글게 */
            border-radius: 8px;

            /* ⭐ 핵심 수정: 폼 컨테이너의 최대 너비 제한 (예: 400px) */
            max-width: 50%;
            /* ⭐ 핵심 수정: 폼 컨테이너를 화면 중앙에 배치 */
            margin: 50px auto; /* 위/아래 여백 50px, 좌/우 auto로 중앙 정렬 */
        }

        /* 모든 기본 텍스트 색상을 어둡게 (가독성 확보) */
        .form-group label {
            color: #333333;
        }
        /* 버튼 그룹 중앙 정렬을 위한 스타일 */
        .button-group {
            text-align: center;
            margin-top: 20px;
            display: flex; /* 버튼을 가로로 배치하기 위해 flex 사용 */
            flex-direction: column; /* 버튼을 세로로 정렬 */
            gap: 10px; /* 버튼 사이 간격 */
            align-items: center; /* 중앙 정렬 */
        }
         /* 카카오 버튼 전용 스타일 */
        .btn-kakao {
             background-color: #FEE500; /* 카카오 노란색 */
             color: #3C1E1E; /* 카카오 글자색 */
             border: none;
             width: 100%;
             max-width: 300px; /* 버튼 최대 너비 */
             font-weight: bold;
        }

        /* 기존 버튼 중앙 정렬을 button-group으로 대체 */
        /* .member-form-container form > div:last-of-type {
            text-align: center;
        } */
    </style>
</th:block>

<th:block layout:fragment="script">

    <script th:inline="javascript">
        $(document).ready(function(){
            var errorMessage = [[${errorMessage}]];
            if(errorMessage != null){
                alert(errorMessage);
            }
        });
    </script>

</th:block>

<div layout:fragment="content">

    <div class="member-form-container">
        <h2 style="text-align: center; margin-bottom: 25px; color: #333333;">회원가입</h2>

        <form action="/members/new" role="form" method="post" th:object="${memberFormDto}">
            <div class="form-group">
                <label th:for="name">이름</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="이름을 입력해주세요">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError">Incorrect data</p>
            </div>
            <div class="form-group">
                <label th:for="email">이메일주소</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="이메일을 입력해주세요">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="fieldError">Incorrect data</p>
            </div>
            <div class="form-group">
                <label th:for="password">비밀번호</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="비밀번호 입력">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="fieldError">Incorrect data</p>
            </div>
            <div class="form-group">
                <label th:for="address">주소</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="주소를 입력해주세요">
                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="fieldError">Incorrect data</p>
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-primary" style="max-width: 300px; width: 100%;">회원가입</button>

                <a href="/oauth2/authorization/kakao" class="btn btn-kakao">
                    <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" style="height: 1.2em; margin-right: 8px;" alt="카카오 로고"/>
                    카카오로 회원가입
                </a>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </div>

</div>

</html>
